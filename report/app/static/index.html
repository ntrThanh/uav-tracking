<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX Studio - Trình soạn thảo & Biên dịch Local</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-dark">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-left">
      <button id="btn-toggle-sidebar" class="icon-btn" title="Đóng/Mở thanh tệp (Ctrl+B)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
      <div class="brand-info">
        <span class="brand-title">LaTeX Studio</span>
        <span class="project-tag" id="project-name">report</span>
      </div>
    </div>

    <div class="header-center">
      <div class="compile-group">
        <button id="btn-compile" class="btn btn-primary" title="Biên dịch (Ctrl+Enter hoặc Ctrl+S)">
          <svg class="spin-icon hidden" id="compile-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
            <path d="M12 2a10 10 0 0 1 10 10" />
          </svg>
          <span id="compile-text">Biên dịch</span>
          <kbd class="shortcut-badge">Ctrl+Enter</kbd>
        </button>

        <select id="select-passes" class="select-control" title="Số pass biên dịch">
          <option value="1">1 pass (Nhanh)</option>
          <option value="2" selected>2 pass (Đầy đủ mục lục & ref)</option>
        </select>
      </div>

      <button id="btn-save" class="btn btn-secondary" title="Lưu file hiện tại (Ctrl+S)">
        <span>Lưu</span>
      </button>

      <div id="status-pill" class="status-pill status-ready">
        <span class="status-dot"></span>
        <span id="status-text">Sẵn sàng</span>
      </div>
    </div>

    <div class="header-right">
      <button id="btn-download-pdf" class="btn btn-ghost" title="Tải file PDF về máy">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Tải PDF</span>
      </button>

      <button id="btn-open-pdf-tab" class="btn btn-ghost" title="Mở PDF trong tab trình duyệt mới">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>Tab mới</span>
      </button>

      <button id="btn-theme-toggle" class="icon-btn" title="Đổi giao diện Sáng / Tối">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="workspace">
    <!-- Left: File Sidebar -->
    <aside id="file-sidebar" class="file-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">TẬP TIN DỰ ÁN</span>
        <div class="sidebar-actions">
          <button id="btn-new-file" class="mini-btn" title="Tạo tệp mới">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
          </button>
          <button id="btn-upload-file" class="mini-btn" title="Tải ảnh lên figures/">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </button>
          <button id="btn-refresh-files" class="mini-btn" title="Làm mới danh sách">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Hidden file input for upload -->
      <input type="file" id="upload-input" style="display: none;" accept="image/*,.pdf,.tex,.txt">

      <div class="file-tree" id="file-tree-container">
        <!-- Generated dynamically -->
      </div>

      <div class="sidebar-footer">
        <div class="file-filter-box">
          <input type="checkbox" id="chk-show-artifacts">
          <label for="chk-show-artifacts">Hiện file tạm (.aux, .toc)</label>
        </div>
      </div>
    </aside>

    <!-- Center: Code Editor Pane -->
    <section class="editor-pane" id="editor-container-pane">
      <div class="editor-header">
        <div class="editor-tabs">
          <div class="tab-item active" id="current-file-tab">
            <span class="file-tab-icon">TEX</span>
            <span id="active-filename">main.tex</span>
            <span id="unsaved-badge" class="unsaved-dot hidden" title="Có thay đổi chưa lưu">•</span>
          </div>
        </div>
        <div class="editor-meta">
          <span id="cursor-pos">Dòng 1, Cột 1</span>
        </div>
      </div>

      <!-- Monaco Editor Container -->
      <div id="monaco-host" class="monaco-host"></div>

      <!-- Image Preview Container (when image file is selected) -->
      <div id="image-viewer-host" class="image-viewer-host hidden">
        <div class="image-preview-wrapper">
          <img id="preview-image-elem" src="" alt="Preview">
          <p id="preview-image-caption" class="preview-caption"></p>
        </div>
      </div>
    </section>

    <!-- Draggable Divider -->
    <div class="pane-resizer" id="pane-resizer"></div>

    <!-- Right: PDF Preview & Diagnostics -->
    <section class="preview-pane" id="preview-container-pane">
      <div class="preview-header">
        <div class="preview-tabs">
          <button class="preview-tab active" data-tab="pdf">
            <span>Bản xem PDF</span>
          </button>
          <button class="preview-tab" data-tab="logs">
            <span>Nhật ký & Lỗi</span>
            <span id="error-badge" class="error-badge hidden">0</span>
            <span id="warning-badge" class="warning-badge hidden">0</span>
          </button>
          <button class="preview-tab" data-tab="raw">
            <span>Console Output</span>
          </button>
        </div>

        <div class="preview-controls">
          <button id="btn-refresh-pdf" class="mini-btn" title="Tải lại PDF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Tab Content: PDF View -->
      <div class="tab-body active" id="tab-content-pdf">
        <div id="pdf-empty-state" class="empty-state hidden">
          <p>Chưa có file PDF được biên dịch.</p>
          <button class="btn btn-primary" onclick="window.compileLatex()">Bấm để Biên dịch</button>
        </div>
        <iframe id="pdf-frame" src="about:blank" frameborder="0"></iframe>
      </div>

      <!-- Tab Content: Structured Diagnostics & Errors -->
      <div class="tab-body" id="tab-content-logs">
        <div class="diagnostics-panel" id="diagnostics-container">
          <div class="diag-summary" id="diag-summary-box">
            <span id="diag-summary-text">Chưa có thông tin biên dịch.</span>
          </div>

          <div class="diag-section">
            <h4 class="diag-title error-title">Lỗi biên dịch (<span id="diag-err-count">0</span>)</h4>
            <div id="diag-errors-list" class="diag-list">
              <p class="diag-empty">Không có lỗi nào.</p>
            </div>
          </div>

          <div class="diag-section">
            <h4 class="diag-title warning-title">Cảnh báo (<span id="diag-warn-count">0</span>)</h4>
            <div id="diag-warnings-list" class="diag-list">
              <p class="diag-empty">Không có cảnh báo.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab Content: Raw Log -->
      <div class="tab-body" id="tab-content-raw">
        <div class="raw-log-toolbar">
          <button id="btn-fetch-full-log" class="btn btn-secondary btn-sm">Tải toàn bộ main.log</button>
        </div>
        <pre id="raw-log-view" class="raw-log-view">Nhấn "Biên dịch" để hiển thị log.</pre>
      </div>
    </section>
  </main>

  <!-- Modal for Creating New File -->
  <div id="modal-new-file" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Tạo tập tin mới</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label for="new-filename-input">Tên file (ví dụ: <code>chapter4.tex</code>):</label>
        <input type="text" id="new-filename-input" class="modal-input" placeholder="ten_file.tex">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel-btn">Hủy</button>
        <button class="btn btn-primary" id="modal-create-btn">Tạo mới</button>
      </div>
    </div>
  </div>

  <!-- Monaco Editor loader from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <!-- Application JS -->
  <script src="/static/editor.js?v=2"></script>
</body>
</html>
